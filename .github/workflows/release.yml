# Tag vX.Y.Z (matching manifest.json "version") to test, build, have Mozilla sign the
# Firefox build as unlisted, and publish a GitHub release with the .xpi and the Chrome zip.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci
      - run: npm test
      - run: npm run lint

      - name: Tag matches manifest version
        run: test "v$(jq -r .version manifest.json)" = "$GITHUB_REF_NAME"

      - run: npm run build

      - name: Sign Firefox build (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx web-ext sign --source-dir dist/firefox --artifacts-dir dist/signed --channel unlisted --approval-timeout 900000

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/signed/*.xpi dist/*-chrome.zip --title "$GITHUB_REF_NAME" --generate-notes
