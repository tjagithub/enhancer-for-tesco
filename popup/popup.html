<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tesco Price Highlight</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="thl-head">
    <span class="thl-logo">£</span>
    <h1>Tesco Price Highlight</h1>
  </header>

  <label class="thl-switch">
    <span>Highlight prices on Tesco</span>
    <input type="checkbox" id="enabled" checked />
    <span class="thl-toggle" aria-hidden="true"></span>
  </label>

  <fieldset class="thl-field">
    <legend>Scoring</legend>
    <label class="thl-radio">
      <input type="radio" name="mode" value="bands" checked />
      <span>Fixed bands (£/kg)</span>
    </label>
    <label class="thl-radio">
      <input type="radio" name="mode" value="relative" />
      <span>Compare to other products on the page</span>
    </label>
  </fieldset>

  <fieldset class="thl-field" id="bands">
    <legend>Bands</legend>
    <div class="thl-bands">
      <div class="thl-band-row thl-band-head">
        <span></span>
        <span class="thl-band-col">low under</span>
        <span class="thl-band-col">high above</span>
      </div>
      <div class="thl-band-row">
        <span class="thl-band-name">Per kg</span>
        <span class="thl-input"><input id="kgLow" type="number" step="0.1" min="0" inputmode="decimal" /></span>
        <span class="thl-input"><input id="kgMid" type="number" step="0.1" min="0" inputmode="decimal" /></span>
      </div>
      <div class="thl-band-row">
        <span class="thl-band-name">Per item</span>
        <span class="thl-input"><input id="eachLow" type="number" step="0.05" min="0" inputmode="decimal" /></span>
        <span class="thl-input"><input id="eachMid" type="number" step="0.05" min="0" inputmode="decimal" /></span>
      </div>
    </div>
  </fieldset>

  <label class="thl-switch">
    <span>Flag Clubcard price</span>
    <input type="checkbox" id="flagRegular" checked />
    <span class="thl-toggle" aria-hidden="true"></span>
  </label>

  <label class="thl-switch">
    <span>Verdict icons</span>
    <input type="checkbox" id="ratingIcons" checked />
    <span class="thl-toggle" aria-hidden="true"></span>
  </label>

  <footer class="thl-legend">
    <span class="thl-swatch thl-swatch-low">LOW</span>
    <span class="thl-swatch thl-swatch-mid">MID</span>
    <span class="thl-swatch thl-swatch-high">HIGH</span>
    <span class="thl-swatch thl-swatch-cc">CC</span>
  </footer>

  <p class="thl-saved" id="saved" hidden>Saved ✓</p>

  <script src="popup.js"></script>
</body>
</html>
